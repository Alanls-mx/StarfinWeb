name: StarfinWeb Review
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: starfin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d starfin_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:testpass@127.0.0.1:5432/starfin_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run web:typecheck
      - run: npm run server:typecheck
      - run: node --import tsx --test server/src/postgres-sync.test.ts
      - run: node --import tsx --test server/src/payment-validation.test.ts
      - run: python3 -m pip install --break-system-packages psycopg2-binary
      - run: node --import tsx --test server/src/payment-persistence.test.ts
      - run: node --import tsx --test server/src/license-contract.test.ts
      - run: node --import tsx --test server/src/release-access.test.ts
